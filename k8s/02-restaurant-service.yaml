apiVersion: v1
kind: ConfigMap
metadata:
  name: restaurant-service-config
  namespace: fooddash
data:
  SEED_DATA: "true"
  PORT: "8001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: fooddash
  labels: { app: restaurant-service, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: restaurant-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: restaurant-service, tier: backend }
    spec:
      containers:
        - name: restaurant-service
          image: restaurant-service:1.0.0
          imagePullPolicy: IfNotPresent   # image is built inside minikube's Docker
          ports: [{ containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: restaurant-service-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: restaurant-db-secret, key: DATABASE_URL }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: fooddash
  labels: { app: restaurant-service }
spec:
  type: NodePort
  selector: { app: restaurant-service }
  ports:
    - { name: http, port: 8001, targetPort: 8001, nodePort: 30081 }
---
# Scale out automatically under load (needs: minikube addons enable metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: restaurant-service-hpa
  namespace: fooddash
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: restaurant-service }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
