# Dedicated PostgreSQL for the Restaurant Service (database-per-service).
apiVersion: v1
kind: Secret
metadata:
  name: restaurant-db-secret
  namespace: fooddash
type: Opaque
stringData:
  POSTGRES_DB: restaurant_db
  POSTGRES_USER: restaurant
  POSTGRES_PASSWORD: restaurant-pass
  DATABASE_URL: postgresql+psycopg://restaurant:restaurant-pass@restaurant-db:5432/restaurant_db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restaurant-db-pvc
  namespace: fooddash
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-db
  namespace: fooddash
  labels: { app: restaurant-db, tier: database }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: restaurant-db }
  template:
    metadata:
      labels: { app: restaurant-db, tier: database }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: restaurant-db-secret }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "restaurant", "-d", "restaurant_db"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: restaurant-db-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-db
  namespace: fooddash
spec:
  selector: { app: restaurant-db }
  ports: [{ port: 5432, targetPort: 5432 }]
